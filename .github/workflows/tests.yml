name: Installer and configuration tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the reference Codex CLI
        run: npm install --global @openai/codex@0.170.0
      - name: Test installers, catalog and reasoning choices
        run: python -m unittest discover -s tests -v
